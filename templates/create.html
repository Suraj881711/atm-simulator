<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Create Account — ATM</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(to right, #00b4db, #0083b0);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px 0;
        }
        .card-box {
            background: #ffffff;
            padding: 30px 40px;
            border-radius: 15px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 420px;
        }
        .card-box h2 {
            margin-bottom: 8px;
            font-weight: bold;
            color: #0083b0;
        }
        .form-control { height: 45px; }
        .btn-primary { background-color: #0083b0; border: none; }
        .btn-primary:hover { background-color: #005f75; }
    </style>
</head>
<body>
    <div class="card-box">
        <h2 class="text-center">🆕 Create Account</h2>
        <p class="text-center text-muted">Open a new ATM account in seconds</p>

        {% if message %}
            <div class="alert alert-success text-center">{{ message }}</div>
            <a href="/" class="btn btn-primary w-100">Go to Login</a>
        {% else %}
        <form method="POST">
            <div class="mb-3">
                <label for="name" class="form-label">Full Name</label>
                <input type="text" class="form-control" id="name" name="name" required>
            </div>
            <div class="mb-3">
                <label for="pin" class="form-label">Choose a 4-digit PIN</label>
                <input type="password" class="form-control" id="pin" name="pin" maxlength="4" inputmode="numeric" required>
            </div>
            <div class="mb-3">
                <label for="confirm_pin" class="form-label">Confirm PIN</label>
                <input type="password" class="form-control" id="confirm_pin" name="confirm_pin" maxlength="4" inputmode="numeric" required>
            </div>
            <div class="mb-3">
                <label for="opening_deposit" class="form-label">Opening Deposit (₹, optional)</label>
                <input type="number" step="0.01" min="0" class="form-control" id="opening_deposit" name="opening_deposit" placeholder="0">
            </div>
            <button type="submit" class="btn btn-primary w-100">Create Account</button>
            {% if error %}
                <div class="text-center mt-2" style="color:#dc3545; font-weight:500;">{{ error }}</div>
            {% endif %}
        </form>
        <p class="text-center mt-3 mb-0">Already have an account?
            <a href="/">Login</a>
        </p>
        {% endif %}
        <p class="text-center mt-2" style="font-size:0.85rem; color:#666;">
            Your PIN is stored only as a salted cryptographic hash — never in plain text.
        </p>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
